<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&D Alignment Wizard</title>
<style>
:root{
  --parchment:#e9dcb8;
  --parchment-dark:#dcc99a;
  --ink:#3a2a17;
  --ink-soft:#5c4326;
  --gold:#a9791f;
  --gold-bright:#d4af37;
  --wood:#241408;
  --wood-deep:#150c05;
  --good:#1f5c3a;
  --evil:#7a1414;
  --neutral:#5c4a1e;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Georgia,'Times New Roman',serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:40px 16px;
  background:
    radial-gradient(circle at 50% -10%, #4a2f14 0%, var(--wood) 45%, var(--wood-deep) 100%);
}
.card{
  position:relative;
  max-width:760px;
  width:100%;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.25), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(0,0,0,.08), transparent 45%),
    repeating-linear-gradient(120deg, rgba(120,90,40,.05) 0 2px, transparent 2px 6px),
    linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  border-radius:6px;
  box-shadow:
    0 0 0 2px var(--wood-deep),
    0 0 0 6px var(--gold),
    0 0 0 8px var(--wood-deep),
    0 20px 50px rgba(0,0,0,.55);
  padding:40px 44px;
}
.card::before{
  content:"";
  position:absolute;
  inset:14px;
  border:1px solid rgba(58,42,23,.35);
  border-radius:2px;
  pointer-events:none;
}
h1{
  text-align:center;
  margin:0 0 6px;
  font-size:1.9rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}
.subtitle{
  text-align:center;
  font-style:italic;
  color:var(--ink-soft);
  margin-bottom:18px;
  font-size:.95rem;
}
.divider{
  text-align:center;
  color:var(--gold);
  letter-spacing:.4em;
  margin:0 0 22px;
  font-size:.9rem;
}
#progress{
  text-align:center;
  color:var(--ink-soft);
  font-variant:small-caps;
  letter-spacing:.08em;
  margin-bottom:22px;
}
#question{
  font-size:1.5rem;
  font-weight:700;
  text-align:center;
  min-height:90px;
  line-height:1.4;
  color:var(--ink);
}
.choice{
  display:block;
  width:100%;
  margin:12px 0;
  padding:15px 20px;
  font-family:inherit;
  font-size:1.05rem;
  text-align:left;
  color:var(--ink);
  border:1px solid var(--gold);
  border-radius:2px;
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(0,0,0,.03));
  box-shadow:inset 0 0 0 1px rgba(58,42,23,.15);
  cursor:pointer;
  transition:background .15s, box-shadow .15s, transform .1s;
}
.choice:hover{
  background:linear-gradient(180deg, rgba(212,175,55,.35), rgba(212,175,55,.12));
  box-shadow:inset 0 0 0 1px var(--gold), 0 0 12px rgba(212,175,55,.5);
  transform:translateY(-1px);
}
.choice:active{transform:translateY(0)}
#restart{
  display:block;
  margin:28px auto 0;
  padding:12px 26px;
  font-family:inherit;
  font-variant:small-caps;
  letter-spacing:.08em;
  font-size:1rem;
  color:var(--parchment);
  background:linear-gradient(180deg,#5a3d1c,var(--wood));
  border:1px solid var(--gold);
  border-radius:3px;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.4);
}
#restart:hover{box-shadow:0 3px 12px rgba(212,175,55,.5)}
.result{border-top:1px dashed var(--gold);margin-top:8px;padding-top:22px;text-align:center}
.seal{
  display:inline-block;
  margin:0 auto 18px;
  padding:16px 30px;
  border-radius:50%/40%;
  border:3px double var(--seal-color,var(--gold));
  color:var(--seal-color,var(--ink));
  font-size:1.7rem;
  font-weight:bold;
  letter-spacing:.02em;
  box-shadow:0 0 0 4px rgba(0,0,0,.05) inset, 0 2px 6px rgba(0,0,0,.2);
}
.result p.flavor{font-style:italic;color:var(--ink-soft);max-width:520px;margin:0 auto 18px}
.result h3{
  font-variant:small-caps;
  letter-spacing:.08em;
  color:var(--ink-soft);
  border-bottom:1px solid var(--gold);
  display:inline-block;
  padding-bottom:2px;
  margin:22px 0 10px;
}
.result ul{list-style:none;padding:0;margin:0 auto;max-width:420px;text-align:left}
.result ul li{padding:6px 0 6px 22px;position:relative;border-bottom:1px dotted rgba(58,42,23,.25)}
.result ul li:last-child{border-bottom:none}
.result ul li::before{content:"❖";position:absolute;left:0;color:var(--gold)}
.examples{font-style:italic;color:var(--ink-soft)}
</style></head><body><div class="card">
<h1>D&amp;D Alignment Wizard</h1>
<div class="subtitle">A rite of divination to reveal thy moral compass</div>
<div class="divider">⚜ ─────── ⚜</div>
<div id="progress"></div>
<div id="app"></div>
<button id="restart">⟲ Begin Anew</button>
</div>
<script>
const info={
"Lawful Good":["You believe compassion and justice flourish through honor and order.",["Keeps promises","Respects legitimate authority","Protects the innocent"],["Bahamut","Torm","Superman","Captain America"]],
"Neutral Good":["Helping others matters more than rules or rebellion.",["Compassionate","Practical","Kind"],["Yoda","Samwise Gamgee"]],
"Chaotic Good":["Freedom allows people to do what's right.",["Independent","Kind-hearted","Rebellious"],["Robin Hood","Han Solo"]],
"Lawful Neutral":["Order and duty are the foundation of society.",["Disciplined","Honorable","Reliable"],["Judge Dredd"]],
"True Neutral":["Balance or practicality guide your choices.",["Pragmatic","Balanced","Adaptable"],["Many druids"]],
"Chaotic Neutral":["Personal freedom comes before rules.",["Independent","Unpredictable","Free-spirited"],["Jack Sparrow"]],
"Lawful Evil":["Rules are useful tools for achieving power.",["Disciplined","Calculating","Authoritarian"],["Darth Vader"]],
"Neutral Evil":["Self-interest is your guiding principle.",["Self-serving","Practical","Merciless"],["Littlefinger"]],
"Chaotic Evil":["Rules only get in the way of your desires.",["Destructive","Impulsive","Cruel"],["The Joker"]]
};
const tree={q:"When making decisions, whose interests usually come first?",step:1,a:{
"❤️ I genuinely try to help other people.":{q:"How do you feel about laws, traditions, and authority?",step:2,a:{
"🏛️ They're important and should usually be respected.":{r:"Lawful Good"},
"🕊️ Doing what's right matters more than following rules.":{q:"Even if you don't always obey them, are laws generally a good guide for society?",step:3,a:{
"👍 Yes, they're usually helpful.":{r:"Neutral Good"},
"🔥 No. People should follow their conscience instead.":{r:"Chaotic Good"}}}}},
"😐 It depends on the situation.":{q:"How important are laws, traditions, and established order to you?",step:2,a:{
"🏛️ Very important.":{r:"Lawful Neutral"},
"🤷 Sometimes.":{q:"Should people generally use laws as a guide when making decisions?",step:3,a:{
"🤷 Sometimes.":{r:"True Neutral"},
"❌ Not really.":{r:"Chaotic Neutral"}}}}},
"🗡️ I usually put myself first.":{q:"How useful are laws and authority to you?",step:2,a:{
"👑 They're useful tools and should be maintained.":{r:"Lawful Evil"},
"💰 They're only useful if they benefit me.":{q:"Even if they don't benefit you personally, are laws generally good for society?",step:3,a:{
"👍 Usually.":{r:"Neutral Evil"},
"🔥 No. They're just obstacles.":{r:"Chaotic Evil"}}}}}
}};
const app=document.getElementById("app");
const progress=document.getElementById("progress");
function sealColor(r){
if(r.includes("Good"))return "var(--good)";
if(r.includes("Evil"))return "var(--evil)";
return "var(--neutral)";
}
function render(n){
if(n.r){
let d=info[n.r];
app.innerHTML=`<div class=result>
<div class=seal style="--seal-color:${sealColor(n.r)}">${n.r}</div>
<p class=flavor>${d[0]}</p>
<h3>Typical Traits</h3>
<ul>${d[1].map(x=>`<li>${x}</li>`).join("")}</ul>
<h3>Known Throughout the Realms As</h3>
<p class=examples>${d[2].join(", ")}</p>
</div>`;
progress.textContent="The scroll is complete";
return;
}
progress.textContent=`Chapter ${n.step} of 3`;
app.innerHTML=`<div id=question>${n.q}</div>`;
for(let k in n.a){
let btn=document.createElement("button");
btn.className="choice";
btn.textContent=k;
btn.onclick=()=>render(n.a[k]);
app.appendChild(btn);
}
}
restart.onclick=()=>render(tree);
render(tree);
</script></body></html>
